    <text x="251" y="282" font-size="17" font-weight="600" fill="#c7b5ff">LLM Wire Debug</text>
    <text x="50" y="331" font-size="12" letter-spacing="2" fill="#7b91b2">LEARN / INSPECT / DEBUG</text>
  </g>
  <path d="M906 107V162H1012M1052 182V235H1155M1003 182V235H905" stroke="#426686" stroke-width="3" fill="none"/>
  <rect x="831" y="67" width="151" height="49" rx="12" fill="#143247" stroke="#3b9fb8"/>
  <rect x="960" y="142" width="154" height="51" rx="12" fill="#272341" stroke="#9176ce"/>
