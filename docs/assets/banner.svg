<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">DSH Inspector Plugins</title>
  <desc id="desc">Understand the Agent loop with Flow Lens. Inspect original HTTP and SSE with LLM Wire Debug. Independent community plugins.</desc>
  <rect width="1280" height="360" rx="20" fill="#0b1020"/>
  <path d="M0 275H1280M0 307H1280M0 339H1280M780 0V360M860 0V360M940 0V360M1020 0V360M1100 0V360M1180 0V360" stroke="#17223b"/>
  <rect x="48" y="35" width="290" height="29" rx="14" fill="#16283d"/>
  <circle cx="65" cy="49" r="4" fill="#5eead4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
