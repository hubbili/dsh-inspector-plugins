    <text x="48" y="127" font-size="55" font-weight="750" letter-spacing="-2" fill="#f1f5ff">DSH Inspector Plugins</text>
    <text x="50" y="175" font-size="24" fill="#b5c5e1">Understand the loop. Inspect the wire.</text>
    <text x="50" y="210" font-size="17" fill="#7f94b5">From effective prompts to raw model responses.</text>
    <rect x="49" y="255" width="167" height="43" rx="10" fill="#153247" stroke="#2f7186"/>
    <text x="70" y="282" font-size="17" font-weight="600" fill="#83e8f5">Flow Lens</text>
