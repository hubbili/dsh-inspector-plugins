<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Two complementary views of DeepSeek Harness</title>
  <desc id="desc">Flow Lens uses Session events for execution learning. LLM Wire Debug uses matching HTTP traffic for raw requests and responses. There is no precise Session to HTTP correlation.</desc>
  <rect width="1280" height="440" rx="20" fill="#0b1020"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="44" y="46" fill="#f1f5ff" font-size="25" font-weight="700">One host. Two ways to understand it.</text>
    <rect x="435" y="76" width="410" height="47" rx="11" fill="#1c2840" stroke="#405372"/>
    <text x="640" y="106" fill="#dbe7fc" font-size="19" text-anchor="middle" font-weight="600">DeepSeek Harness Web</text>
    <path d="M640 124V144H320V169M640 144H960V169" stroke="#506381" stroke-width="2" fill="none"/>
    <rect x="42" y="169" width="573" height="197" rx="14" fill="#102636" stroke="#2f6c80"/>
    <rect x="665" y="169" width="573" height="197" rx="14" fill="#211d37" stroke="#5e488a"/>
    <text x="66" y="203" fill="#81e1f0" font-size="23" font-weight="700">Flow Lens</text>
    <text x="690" y="203" fill="#c6b5ff" font-size="23" font-weight="700">LLM Wire Debug</text>
    <text x="66" y="232" fill="#b1c8d8" font-size="16">Session events → execution learning</text>
    <text x="690" y="232" fill="#c2b9d9" font-size="16">Matching HTTP traffic → transport inspection</text>
    <path d="M66 251H591M690 251H1214" stroke="#3b4c67"/>
    <text x="66" y="279" fill="#e0edf8" font-size="17">Effective prompt · graph · tool results</text>
    <text x="66" y="309" fill="#a0b8d0" font-size="17">Timeline · source paths · extension reference</text>
    <text x="66" y="341" fill="#69b9c6" font-size="14">Selected Session / loaded history</text>
    <text x="690" y="279" fill="#eee8ff" font-size="17">Original cURL · request JSON · raw SSE</text>
    <text x="690" y="309" fill="#c1b4d9" font-size="17">Readable response · live updates · translation</text>
    <text x="690" y="341" fill="#ad97d6" font-size="14">Process-wide / intentionally unredacted</text>
    <text x="640" y="410" fill="#9cabc3" font-size="16" text-anchor="middle">Complementary views — not a one-to-one Session / HTTP correlation</text>
  </g>
</svg>
